app-id: org.mediaharbor.MediaHarbor
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24
  # libclang for bindgen (cpal's pipewire host); the SDK ships none.
  - org.freedesktop.Sdk.Extension.llvm22
command: mediaharbor

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin:/usr/lib/sdk/llvm22/bin

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  # cpal's native PulseAudio client needs the auth cookie, or it falls back to ALSA.
  - --filesystem=xdg-config/pulse:ro
  # Flatpak has no --socket=pipewire; expose the socket from the runtime dir.
  - --filesystem=xdg-run/pipewire-0
  - --share=network

add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    version: '24.08'
    directory: lib/ffmpeg
    add-ld-path: .

cleanup-commands:
  - mkdir -p /app/lib/ffmpeg

modules:
  # N_m3u8DL-RE for gamdl's HLS downloads, bundled because the sandbox blocks
  # downloading it at runtime. x86_64-only asset.
  - name: nm3u8dlre
    buildsystem: simple
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/nilaoda/N_m3u8DL-RE/releases/download/v0.6.0-beta/N_m3u8DL-RE_v0.6.0-beta_linux-x64_20260629.tar.gz
        sha256: 2ebcd450594a08c0de0bcd502a80c5d3f89a702a0fa6604199527bb8d6eee4db
        strip-components: 0
    build-commands:
      - install -Dm755 N_m3u8DL-RE /app/bin/N_m3u8DL-RE

  - name: mediaharbor
    buildsystem: simple

    build-options:
      env:
        CARGO_HOME: /run/build/mediaharbor/cargo-home
        RUSTUP_HOME: /usr/lib/sdk/rust-stable
        RUSTUP_TOOLCHAIN: stable
        CARGO_INCREMENTAL: '0'
        npm_config_cache: /run/build/mediaharbor/flatpak-node/npm-cache
        LIBCLANG_PATH: /usr/lib/sdk/llvm22/lib

    sources:
      - type: git
        url: https://github.com/MediaHarbor/mediaharbor.git
        tag: GIT_TAG_PLACEHOLDER
        commit: GIT_COMMIT_PLACEHOLDER

      - cargo-sources.json

      - generated-sources.json

    build-commands:
      - mkdir -p .cargo
      - |
        printf '[source.crates-io]\nreplace-with = "vendored-sources"\n\n[source."vendored-sources"]\ndirectory = "cargo/vendor"\n' > .cargo/config.toml

      - npm ci --ignore-scripts

      - npm run build:react

      - cd src/app && cargo build --release

      - install -Dm755 target/release/mediaharbor /app/bin/mediaharbor
      - install -Dm644 packaging/flatpak/org.mediaharbor.MediaHarbor.desktop /app/share/applications/org.mediaharbor.MediaHarbor.desktop
      - install -Dm644 packaging/flatpak/org.mediaharbor.MediaHarbor.metainfo.xml /app/share/metainfo/org.mediaharbor.MediaHarbor.metainfo.xml
      - install -Dm644 src/app/icons/32x32.png /app/share/icons/hicolor/32x32/apps/org.mediaharbor.MediaHarbor.png
      - install -Dm644 src/app/icons/64x64.png /app/share/icons/hicolor/64x64/apps/org.mediaharbor.MediaHarbor.png
      - install -Dm644 src/app/icons/128x128.png /app/share/icons/hicolor/128x128/apps/org.mediaharbor.MediaHarbor.png
      - install -Dm644 src/app/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/org.mediaharbor.MediaHarbor.png
      - install -Dm644 src/app/icons/icon.png /app/share/icons/hicolor/512x512/apps/org.mediaharbor.MediaHarbor.png
