name: mediaharbor
base: core24
version: '2.2.0'
summary: Stream music and manage your local media library
description: |
  MediaHarbor is a music downloader and player. Connect to Spotify, Tidal, Qobuz,
  Deezer, Apple Music, YouTube Music, and SoundCloud to download tracks at native
  quality and play them from a unified local library.

  Features: high-quality audio downloads, built-in player with crossfade and
  visualizer, synced lyrics, automatic metadata tagging, MPRIS media key support.

  Note: the removable-media interface is not auto-connected. To scan music libraries
  on external drives, run: snap connect mediaharbor:removable-media

grade: stable
confinement: strict

plugs:
  desktop:
  desktop-legacy:
  wayland:
  x11:
  opengl:
  audio-playback:
  network:
  network-bind:
  home:
  removable-media:
  browser-support:
    allow-sandbox: false

apps:
  mediaharbor:
    command: bin/mediaharbor
    extensions: [gnome]
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - audio-playback
      - network
      - network-bind
      - home
      - removable-media
      - browser-support
    environment:
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
      GDK_BACKEND: wayland,x11
      # cpal's native PulseAudio client needs the auth cookie; strict confinement
      # remaps $HOME, so point it at the real one. Falls back to ALSA if absent.
      PULSE_COOKIE: $SNAP_REAL_HOME/.config/pulse/cookie

parts:
  mediaharbor:
    plugin: dump
    source: https://github.com/MediaHarbor/mediaharbor/releases/download/v2.2.0/MediaHarbor_2.2.0_amd64.deb
    source-type: deb
    organize:
      usr/bin/mediaharbor: bin/mediaharbor
    stage-packages:
      # Runtime library for cpal's pipewire host.
      - libpipewire-0.3-0
      - libayatana-appindicator3-1
      - ffmpeg
      - python3
      - python3-venv
      - python3-pip
