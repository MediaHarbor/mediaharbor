[package]
name = "mediaharbor-core"
version.workspace = true
edition = "2021"
description = "MediaHarbor backend library – async Rust port of the Electron backend"

[lib]
name = "mediaharbor_core"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }

reqwest = { version = "0.13", features = ["json", "stream", "cookies", "gzip", "deflate", "native-tls", "http2", "system-proxy", "query", "form"], default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
ctr = "0.10"
ecb = "0.2"
blowfish = "0.10"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
cmac = "0.8"
rsa = { version = "0.10.0-rc.18", features = ["sha1", "sha2"] }
base64 = "0.23"

notify = "8"
notify-debouncer-full = "0.7"

lofty = "0.25"

rusqlite = { version = "0.40", features = ["bundled"] }
jwalk = "0.9"
blake3 = "1"

# No default formats: they add AVIF/EXR decoders (~2 MB) that cover art never needs.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "bmp",
    "gif",
] }

quick-xml = "0.42"

axum = { version = "0.8", features = ["tokio"] }
tower-http = { version = "0.7", features = ["cors"] }

rayon = "1"
thread-priority = "3"

dirs = "6"

# `lzma` for third-party ffmpeg archives; no `zstd`, which needs a C build dep.
zip = { version = "8", default-features = false, features = ["deflate", "lzma"] }
tar = "0.4"
flate2 = "1"
lzma-rust2 = { version = "0.16", default-features = false, features = ["std", "xz"] }

tempfile = "3"

git2 = { version = "0.21", features = ["vendored-libgit2"] }

regex = "1"

url = "2"

dashmap = "6"

bytes = "1"

futures-util = "0.3"
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
native-tls = "0.2"
async-trait = "0.1"

thiserror = "2"

chrono = { version = "0.4", features = ["serde"] }

uuid = { version = "1", features = ["v4"] }

hex = "0.4"

opener = "0.8"

getrandom = { version = "0.4", features = ["sys_rng"] }

symphonia = { version = "0.6", features = ["aac", "alac", "isomp4", "mp3", "aiff", "caf"] }
# `pipewire` names the app in the volume mixer (needs clang for bindgen);
# `pulseaudio` is the fallback the Flatpak and Snap sandboxes allow.
cpal = { version = "0.18", features = ["pipewire", "pulseaudio", "realtime"] }
rusty-opus = "0.9"
oxideav-aac = "0.1"
oxideav-core = "0.1"
realfft = "3"
oxideav-ape = "0.0.4"
oxideav-musepack = "0.0.4"
oxideav-speex = "0.0.10"
oxideav-wma = "0.0.4"
oxideav-tta = "0.0.4"
oxideav-ogg = "0.1.8"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
