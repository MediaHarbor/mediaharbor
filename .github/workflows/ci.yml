name: CI

# Tests and lints on every push and PR; the release workflow only runs on tags.
on:
  push:
    tags-ignore: ['v*'] # release tags are handled by tauri-build.yml
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Frontend: lint, typecheck + build, unit tests
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      # `build:react` runs `tsc` before vite, so this is the typecheck too.
      - run: npm run build:react

      - run: npx vitest run

  # Backend: fmt, clippy, tests
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      # Needed to compile tauri and cpal; libclang for the pipewire bindgen.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            clang \
            libclang-dev

      # Advisory until the tree is rustfmt-clean.
      - name: cargo fmt (advisory)
        continue-on-error: true
        run: cargo fmt --all --check

      # Advisory until the current warnings are fixed; then add `-- -D warnings`.
      - name: cargo clippy (advisory)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --no-deps

      # The actual gate.
      - name: cargo test
        run: cargo test --workspace
